services:
  - type: web
    name: theme-flow-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHONPATH
        value: /app
    dockerCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
