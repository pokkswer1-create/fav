<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        background: #fff;
        border-bottom: 1px solid #e4e4e7;
      }

      .toolbar h1 {
        margin: 0;
        font-size: 18px;
      }

      .meta {
        margin: 4px 0 0;
        font-size: 13px;
        color: #71717a;
      }

      .toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 1px solid #d4d4d8;
        background: #fff;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
      }

      button.primary {
        background: #18181b;
        color: #fff;
        border-color: #18181b;
      }

      .content {
        flex: 1;
        padding: 12px 14px 20px;
        overflow: auto;
      }

      .status {
        margin: 0 0 12px;
        font-size: 13px;
        color: #52525b;
      }

      .status.error {
        color: #dc2626;
      }

      /* 이름이 사라지지 않도록: 가로 flex 대신 세로 카드 + 줄바꿈 */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        min-width: 0;
      }

      .name {
        display: block;
        width: 100%;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.4;
        word-break: keep-all;
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .class-name {
        font-size: 12px;
        color: #71717a;
        line-height: 1.3;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .status-select {
        width: 100%;
        padding: 8px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
      }

      .card.marked {
        border-color: #86efac;
        background: #f0fdf4;
      }

      /* 확대(전체 화면) 모드 */
      body.expanded {
        background: #fff;
      }

      body.expanded .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
      }

      body.expanded .grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
      }

      body.expanded .name {
        font-size: 22px;
      }

      body.expanded .status-select {
        font-size: 16px;
        padding: 10px;
      }

      .empty {
        padding: 24px;
        text-align: center;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div>
          <h1>출석체크</h1>
          <p class="meta" id="todayLabel">불러오는 중…</p>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="expandBtn">확대</button>
          <button type="button" id="reloadBtn">새로고침</button>
        </div>
      </header>

      <main class="content">
        <p class="status" id="statusMsg"></p>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>등록된 학생이 없습니다.</div>
      </main>
    </div>

    <script>
      const STATUSES = ["출석", "결석", "지각", "조퇴", "보강"];
      let markedMap = {};

      const gridEl = document.getElementById("grid");
      const emptyEl = document.getElementById("empty");
      const statusEl = document.getElementById("statusMsg");
      const todayLabel = document.getElementById("todayLabel");
      const expandBtn = document.getElementById("expandBtn");
      const reloadBtn = document.getElementById("reloadBtn");

      expandBtn.addEventListener("click", () => {
        const on = document.body.classList.toggle("expanded");
        expandBtn.textContent = on ? "축소" : "확대";
      });

      reloadBtn.addEventListener("click", load);

      function setStatus(msg, isError) {
        statusEl.textContent = msg || "";
        statusEl.className = isError ? "status error" : "status";
      }

      function render(students) {
        gridEl.innerHTML = "";
        if (!students.length) {
          emptyEl.hidden = false;
          return;
        }
        emptyEl.hidden = true;

        students.forEach((student) => {
          const card = document.createElement("article");
          card.className = "card";
          if (markedMap[student.name]) card.classList.add("marked");

          const nameEl = document.createElement("span");
          nameEl.className = "name";
          nameEl.textContent = student.name;

          card.appendChild(nameEl);

          if (student.className) {
            const classEl = document.createElement("span");
            classEl.className = "class-name";
            classEl.textContent = student.className;
            card.appendChild(classEl);
          }

          const select = document.createElement("select");
          select.className = "status-select";
          STATUSES.forEach((label) => {
            const opt = document.createElement("option");
            opt.value = label;
            opt.textContent = label;
            select.appendChild(opt);
          });
          select.value = markedMap[student.name] || "출석";

          select.addEventListener("change", () => {
            setStatus(student.name + " 저장 중…");
            google.script.run
              .withSuccessHandler((res) => {
                markedMap[student.name] = res.status;
                card.classList.add("marked");
                setStatus(student.name + " → " + res.status);
              })
              .withFailureHandler((err) => {
                setStatus(err.message || String(err), true);
                select.value = markedMap[student.name] || "출석";
              })
              .markAttendance({ name: student.name, status: select.value });
          });

          card.appendChild(select);
          gridEl.appendChild(card);
        });
      }

      function load() {
        setStatus("목록 불러오는 중…");
        google.script.run
          .withSuccessHandler((data) => {
            markedMap = data.marked || {};
            todayLabel.textContent = data.today + " · " + data.students.length + "명";
            render(data.students || []);
            setStatus("");
          })
          .withFailureHandler((err) => {
            setStatus(err.message || String(err), true);
            gridEl.innerHTML = "";
            emptyEl.hidden = false;
          })
          .getAttendanceData();
      }

      load();
    </script>
  </body>
</html>
